<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Pacientes</ui:define>

    <ui:define name="contenido">

        <h:form id="formPacientes">

            <p:panel header="👥 Listado de Pacientes" styleClass="card-modern">

                <!-- BUSCADOR -->
                <div class="ui-g ui-fluid" style="margin-bottom:15px; align-items:center;">

                    <div class="ui-g-12 ui-md-6">
                        <div class="ui-inputgroup">
                            <p:inputText value="#{pacienteBean.textoBusqueda}"
                                         placeholder="Buscar por nombre del paciente..." />
                            <p:commandButton icon="pi pi-search"
                                             title="Buscar"
                                             actionListener="#{pacienteBean.buscar}"
                                             update="tablaPacientes"
                                             styleClass="ui-button-primary"/>
                        </div>
                    </div>

                    <div class="ui-g-12 ui-md-6" style="text-align:right;">
                        <p:commandButton value="Agregar Paciente"
                                         icon="pi pi-user-plus"
                                         styleClass="ui-button-success"
                                         actionListener="#{pacienteBean.prepararNuevo}"
                                         update=":dialogoPaciente"
                                         oncomplete="PF('wDialogoPaciente').show();" />
                    </div>

                </div>

                <!-- TABLA -->
                <p:dataTable id="tablaPacientes"
             value="#{pacienteBean.listaPacientes}"
             var="pac"
             paginator="true"
             rows="10"
             rowKey="#{pac.id_paciente}"
             styleClass="tabla-pacientes"
             emptyMessage="No se encontraron pacientes registrados.">


                    <p:column headerText="ID" style="text-align:center; width:70px;">
                        #{pac.id_paciente}
                    </p:column>

                    <p:column headerText="Paciente">
                        <strong>#{pac.usuario.nombre} #{pac.usuario.apellidos}</strong>
                    </p:column>

                    <p:column headerText="Correo">
                        #{pac.usuario.correo}
                    </p:column>

                    <p:column headerText="Teléfono" style="text-align:center;">
                        #{pac.usuario.telefono}
                    </p:column>

                    <p:column headerText="EPS">
                        #{pac.eps}
                    </p:column>

                    <p:column headerText="RH" style="text-align:center; width:70px;">
                        <span style="
                            background:#6c757d;
                            color:#ffffff;
                            padding:4px 10px;
                            border-radius:12px;
                            font-weight:700;
                            font-size:0.85rem;">
                            #{pac.rh}
                        </span>
                    </p:column>

                    <!-- ACCIONES -->
                    <p:column headerText="Acciones"
                              style="text-align:center; width:190px;"
                              styleClass="acciones">

                        <!-- EDITAR -->
                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         styleClass="ui-button-warning ui-button-rounded"
                                         actionListener="#{pacienteBean.prepararEdicion(pac)}"
                                         update=":dialogoPaciente"
                                         oncomplete="PF('wDialogoPaciente').show();" />

                        <!-- HISTORIAL -->
                        <p:button icon="pi pi-book"
                                  title="Historial Clínico"
                                  outcome="/medico/historiales/index"
                                  styleClass="ui-button-info ui-button-rounded">
                            <f:param name="idPaciente" value="#{pac.id_paciente}" />
                        </p:button>

                        <!-- INACTIVAR -->
                        <p:commandButton icon="pi pi-trash"
                                         title="Inactivar"
                                         styleClass="ui-button-danger ui-button-rounded"
                                         actionListener="#{pacienteBean.eliminar(pac)}"
                                         update="tablaPacientes">
                            <p:confirm header="Confirmación"
                                       message="¿Desea inactivar este paciente?"
                                       icon="pi pi-exclamation-triangle" />
                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>
        </h:form>

        <!-- DIALOGO -->
        <p:dialog id="dialogoPaciente"
                  widgetVar="wDialogoPaciente"
                  header="🧾 Datos del Paciente"
                  modal="true"
                  width="720"
                  resizable="false"
                  appendTo="@(body)">

            <h:form>

                <p:messages closable="true" />

                <div class="ui-fluid">

                    <h4 style="color:#0d6efd; margin-top:10px;">Datos Personales</h4>

                    <p:panelGrid columns="4" layout="grid"
                                 styleClass="ui-panelgrid-blank">

                        <p:outputLabel value="Nombre:" />
                        <p:inputText value="#{pacienteBean.usuarioActual.nombre}" required="true"/>

                        <p:outputLabel value="Apellidos:" />
                        <p:inputText value="#{pacienteBean.usuarioActual.apellidos}" required="true"/>

                        <p:outputLabel value="Fecha Nacimiento:" />
                        <p:calendar value="#{pacienteBean.pacienteActual.fecha_nacimiento}"
                                    pattern="dd/MM/yyyy"
                                    showOn="button"
                                    navigator="true"
                                    yearRange="c-100:c"
                                    required="true"/>

                        <p:outputLabel value="Correo:" />
                        <p:inputText value="#{pacienteBean.usuarioActual.correo}" required="true"/>

                        <p:outputLabel value="Teléfono:" />
                        <p:inputText value="#{pacienteBean.usuarioActual.telefono}"/>

                        <p:outputLabel value="EPS:" />
                        <p:inputText value="#{pacienteBean.pacienteActual.eps}"/>

                        <p:outputLabel value="RH:" />
                        <p:selectOneMenu value="#{pacienteBean.pacienteActual.rh}">
                            <f:selectItem itemLabel="Seleccione" itemValue="" />
                            <f:selectItem itemLabel="O+" itemValue="O+" />
                            <f:selectItem itemLabel="O-" itemValue="O-" />
                            <f:selectItem itemLabel="A+" itemValue="A+" />
                            <f:selectItem itemLabel="A-" itemValue="A-" />
                            <f:selectItem itemLabel="B+" itemValue="B+" />
                            <f:selectItem itemLabel="AB+" itemValue="AB+" />
                        </p:selectOneMenu>

                    </p:panelGrid>

                </div>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="Guardar"
                                     icon="pi pi-save"
                                     styleClass="ui-button-success"
                                     actionListener="#{pacienteBean.guardarPaciente}"
                                     update=":formPacientes:tablaPacientes :dialogoPaciente"
                                     oncomplete="if(!args.validationFailed) PF('wDialogoPaciente').hide();" />

                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('wDialogoPaciente').hide();"
                                     style="margin-left:10px;" />
                </div>

            </h:form>
        </p:dialog>

        <!-- CONFIRM GLOBAL -->
        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="Sí"
                                 type="button"
                                 icon="pi pi-check"
                                 styleClass="ui-confirmdialog-yes ui-button-success"/>
                <p:commandButton value="No"
                                 type="button"
                                 icon="pi pi-times"
                                 styleClass="ui-confirmdialog-no ui-button-secondary"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
