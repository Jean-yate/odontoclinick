<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Mis Citas</ui:define>

    <ui:define name="contenido">
        
        <h:form id="formMisCitas">
            
            <!-- Encabezado tipo card -->
            <p:panel style="margin-bottom:20px;
                            background: linear-gradient(135deg,#0d6efd,#0b5ed7);
                            color: white; border-radius: 10px; padding: 15px;">
                <h2 style="margin:0">
                    <i class="pi pi-calendar-check"></i> Mi Historial de Citas
                </h2>
            </p:panel>

            <!-- Tabla de citas -->
            <p:dataTable id="tablaCitas" value="#{citaBean.listaCitas}" var="cita" 
                         rowKey="#{cita.id_cita}"
                         paginator="true" rows="10" reflow="true"
                         emptyMessage="No tienes citas registradas."
                         paginatorPosition="bottom"
                         styleClass="table-striped">

                <p:column headerText="Fecha y Hora" sortBy="#{cita.fecha_hora}" width="160">
                    <h:outputText value="#{cita.fecha_hora}" style="font-weight:bold; color:#333;">
                        <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Doctor Asignado">
                    <i class="pi pi-user-md" style="margin-right:5px; color:#0d6efd;"></i>
                    <h:outputText value="#{cita.medico.usuario.nombre} #{cita.medico.usuario.apellidos}" style="font-weight:bold;"/>
                </p:column>

                <p:column headerText="Motivo / Notas">
                    <h:outputText value="#{cita.notas_paciente}" style="color:#555; font-style:italic;"/>
                </p:column>

                <p:column headerText="Estado" style="text-align:center; width:120px;">
                    <h:panelGroup rendered="#{cita.estadoCita.id_estado_cita eq 1}">
                        <span style="background:#ffc107;color:#000;padding:4px 10px;border-radius:4px;font-weight:bold;">Pendiente</span>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{cita.estadoCita.id_estado_cita eq 2}">
                        <span style="background:#0d6efd;color:white;padding:4px 10px;border-radius:4px;font-weight:bold;">Confirmada</span>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{cita.estadoCita.id_estado_cita eq 3}">
                        <span style="background:#dc3545;color:white;padding:4px 10px;border-radius:4px;font-weight:bold;">Cancelada</span>
                    </h:panelGroup>
                    <h:panelGroup rendered="#{cita.estadoCita.id_estado_cita eq 4}">
                        <span style="background:#198754;color:white;padding:4px 10px;border-radius:4px;font-weight:bold;">Atendida</span>
                    </h:panelGroup>
                </p:column>

            </p:dataTable>

            <!-- Mensaje informativo -->
            <div style="margin-top:15px; color:#777; font-size:0.9em;">
                <i class="pi pi-info-circle"></i> Para cancelar o reprogramar una cita, por favor comuníquese con la secretaría.
            </div>

        </h:form>

    </ui:define>
</ui:composition>
