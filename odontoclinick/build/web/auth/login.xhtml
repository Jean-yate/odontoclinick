<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">

    <h:head>
        <title>Iniciar Sesión - Odontoclinick</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />

        <style>
            /* ESTILOS CRÍTICOS PARA QUE SE VEA EL FORMULARIO */
            html, body {
                height: 100%;
                margin: 0;
                background-color: #D3D3D3;
            }

            .auth-container {
                min-height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .auth-card {
                width: 100%;
                max-width: 400px;
                background-color: #ffffff;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            }

            .login-form {
                background-color: #f8f9fa;
                border-radius: 15px;
                padding: 1.5rem;
            }

            /* Forzamos que los inputs se vean como Bootstrap puro */
            .form-control {
                border: 1px solid #ced4da !important;
                background-color: #fff !important;
                color: #212529 !important;
            }
        </style>
    </h:head>

    <h:body>

        <div class="auth-container">
            <div class="auth-card">
                
                <div class="mb-4">
                    <a href="#{request.contextPath}/index.xhtml" class="btn btn-outline-secondary">
                        &larr; Volver
                    </a>
                </div>

                <h2 class="mb-4 text-center fw-bold">Iniciar Sesión</h2>
                
                <p:growl id="growl" showDetail="true" life="4000" />

                <h:form id="loginForm" styleClass="login-form shadow-sm">
                    
                    <div class="mb-3">
                        <label for="txtUsuario" class="form-label fw-semibold">Usuario</label>
                        
                        <h:inputText id="txtUsuario" 
                                     value="#{sesionBean.usuario}"
                                     styleClass="form-control"
                                     required="true"
                                     requiredMessage="El usuario es requerido">
                            <f:passThroughAttribute name="placeholder" value="Ej: admin" />
                            <f:passThroughAttribute name="autofocus" value="true" />
                        </h:inputText>
                        
                        <h:message for="txtUsuario" style="color:#dc3545; font-size: 0.8rem;" />
                    </div>

                    <div class="mb-3">
                        <label for="txtPass" class="form-label fw-semibold">Contraseña</label>
                        
                        <h:inputSecret id="txtPass" 
                                       value="#{sesionBean.contrasena}"
                                       styleClass="form-control"
                                       required="true"
                                       requiredMessage="La contraseña es requerida">
                            <f:passThroughAttribute name="placeholder" value="********" />
                        </h:inputSecret>

                        <h:message for="txtPass" style="color:#dc3545; font-size: 0.8rem;" />
                    </div>

                    <div class="d-grid gap-2">
                        <h:commandButton value="Ingresar" 
                                         action="#{sesionBean.iniciarSesion}" 
                                         styleClass="btn btn-primary fw-bold py-2" />
                    </div>

                    <div class="mt-3 text-center">
                        <a href="#{request.contextPath}/Auth/registro.xhtml" class="text-decoration-none">
                            ¿No tienes cuenta? Regístrate
                        </a>
                    </div>
                </h:form>

            </div>
        </div>

    </h:body>
</html>
