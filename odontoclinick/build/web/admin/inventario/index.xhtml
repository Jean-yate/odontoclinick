<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Inventario</ui:define>

    <ui:define name="contenido">

        <h:form id="formInventario">

            <!-- ===== HEADER ===== -->
            <p:panel style="margin-bottom:20px;
                            background:linear-gradient(135deg,#0d6efd,#0b5ed7);
                            color:white;border-radius:10px">
                <h2 style="margin:0">Gestión de Inventario</h2>
                <p style="margin:5px 0 0;opacity:.9">
                    Control de insumos, stock y precios
                </p>
            </p:panel>

            <p:panel header="Catálogo de Productos" styleClass="card">

                <div style="text-align:right;margin-bottom:15px">
                    <p:commandButton value="Nuevo Producto"
                                     icon="pi pi-plus"
                                     styleClass="ui-button-success"
                                     actionListener="#{productoBean.prepararNuevo}"
                                     update=":dialogoForm"
                                     oncomplete="PF('dlgProd').show()"/>
                </div>

                <!-- ===== TABLA ===== -->
                <p:dataTable id="tabla"
                             value="#{productoBean.listaProductos}"
                             var="prod"
                             paginator="true"
                             rows="10"
                             rowKey="#{prod.id_producto}"
                             emptyMessage="No hay productos registrados">

                    <p:column headerText="Código" width="110">
                        <h:outputText value="#{prod.codigo_producto}"
                                      style="font-weight:bold"/>
                    </p:column>

                    <p:column headerText="Producto"
                              filterBy="#{prod.nombre_producto}"
                              filterMatchMode="contains">
                        <h:outputText value="#{prod.nombre_producto}"
                                      style="font-weight:bold;color:#0d6efd"/>
                    </p:column>

                    <p:column headerText="Categoría">
                        <h:outputText value="#{prod.categoria.nombre_categoria}"/>
                    </p:column>

                    <!-- ===== STOCK ===== -->
                    <p:column headerText="Stock" style="text-align:center;width:130px">

                        <h:panelGroup rendered="#{productoBean.esStockBajo(prod.stock_actual)}">
                            <span style="background:#dc3545;color:white;
                                         padding:5px 10px;border-radius:20px;
                                         font-weight:bold">
                                <i class="pi pi-exclamation-circle"></i>
                                #{prod.stock_actual}
                            </span>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{!productoBean.esStockBajo(prod.stock_actual)}">
                            <span style="background:#198754;color:white;
                                         padding:5px 10px;border-radius:20px;
                                         font-weight:bold">
                                <i class="pi pi-check-circle"></i>
                                #{prod.stock_actual}
                            </span>
                        </h:panelGroup>

                    </p:column>

                    <p:column headerText="Precio Venta" style="text-align:right;width:140px">
                        <h:outputText value="#{prod.precio_venta}">
                            <f:convertNumber type="currency"
                                             currencySymbol="$"
                                             maxFractionDigits="2"/>
                        </h:outputText>
                    </p:column>

                    <!-- ===== ACCIONES ===== -->
                    <p:column headerText="Acciones" style="text-align:center;width:140px">

                        <!-- EDITAR -->
                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         styleClass="ui-button-warning ui-button-flat"
                                         actionListener="#{productoBean.prepararEdicion(prod)}"
                                         update=":dialogoForm"
                                         oncomplete="PF('dlgProd').show()"/>

                        <!-- ELIMINAR -->
                        <p:commandButton icon="pi pi-trash"
                                         title="Eliminar"
                                         styleClass="ui-button-danger ui-button-flat"
                                         actionListener="#{productoBean.eliminar(prod.id_producto)}"
                                         update="tabla">
                            <p:confirm header="Confirmar"
                                       message="¿Eliminar este producto?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>

                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

        <!-- ===== DIALOGO ===== -->
           <p:dialog id="dialogoForm"
          widgetVar="dlgProd"
          header="Datos del Producto"
          modal="true"
          width="500"
          showEffect="fade"
          hideEffect="fade">

    <h:form class="ui-fluid">

        <p:messages showDetail="true" closable="true"/>

        <p:outputLabel value="Categoría"/>
        <p:selectOneMenu value="#{productoBean.idCategoriaSeleccionada}" required="true">
            <f:selectItem itemLabel="Seleccione..." itemValue=""/>
            <f:selectItems value="#{productoBean.listaCategorias}"
                           var="c"
                           itemLabel="#{c.nombre_categoria}"
                           itemValue="#{c.id_categoria}"/>
        </p:selectOneMenu>

        <p:outputLabel value="Código"/>
        <p:inputText value="#{productoBean.productoActual.codigo_producto}" required="true"/>

        <p:outputLabel value="Nombre"/>
        <p:inputText value="#{productoBean.productoActual.nombre_producto}" required="true"/>

        <p:outputLabel value="Descripción"/>
        <p:inputTextarea value="#{productoBean.productoActual.descripcion}" rows="2"/>

        <p:outputLabel value="Stock Actual"/>
        <p:spinner value="#{productoBean.productoActual.stock_actual}" min="0"/>

        <p:outputLabel value="Stock Mínimo"/>
        <p:spinner value="#{productoBean.productoActual.stock_minimo}" min="0"/>

        <p:outputLabel value="Precio Compra"/>
        <p:inputNumber value="#{productoBean.productoActual.precio_compra}"
                       symbol="$ " decimalPlaces="2"/>

        <p:outputLabel value="Precio Venta"/>
        <p:inputNumber value="#{productoBean.productoActual.precio_venta}"
                       symbol="$ " decimalPlaces="2"/>

        <!-- FOOTER DENTRO DEL FORM -->
        <div style="text-align:right;margin-top:15px">
            <p:commandButton value="Cancelar"
                             type="button"
                             icon="pi pi-times"
                             styleClass="ui-button-secondary"
                             onclick="PF('dlgProd').hide()"/>

            <p:commandButton value="Guardar"
                             icon="pi pi-save"
                             styleClass="ui-button-primary"
                             actionListener="#{productoBean.guardar}"
                             update=":formInventario:tabla"
                             oncomplete="if(!args.validationFailed) PF('dlgProd').hide()"/>
        </div>

    </h:form>
</p:dialog>


        <!-- ===== CONFIRM GLOBAL ===== -->
        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="No" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-flat"/>
                <p:commandButton value="Sí" type="button"
                                 styleClass="ui-confirmdialog-yes"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
