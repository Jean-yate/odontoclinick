<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Secretarias</ui:define>

    <ui:define name="contenido">

        <p:panel style="margin-bottom:20px;
                        background:linear-gradient(135deg,#6610f2,#6f42c1);
                        color:white;border-radius:10px">
            <h2 style="margin:0">Administración de Secretarias</h2>
            <p style="margin:5px 0 0;opacity:.9">
                Control de turnos, accesos y estados
            </p>
        </p:panel>

        <h:form id="formLista">

            <p:panel header="Listado de Secretarias">

                <div style="text-align:right;margin-bottom:15px">
                    <p:commandButton value="Agregar Secretaria"
                                     icon="pi pi-user-plus"
                                     styleClass="ui-button-success"
                                     actionListener="#{secretariaBean.prepararNuevo}"
                                     update=":dialogoForm"
                                     oncomplete="PF('wdialogo').show()"/>
                </div>

                <p:dataTable id="tablaSecretarias"
                             value="#{secretariaBean.listaSecretarias}"
                             var="sec"
                             paginator="true"
                             rows="10"
                             rowKey="#{sec.id_secretaria}"
                             emptyMessage="No hay secretarias registradas">

                    <p:column headerText="ID" width="60" style="text-align: center;">
                        <h:outputText value="#{sec.id_secretaria}"/>
                    </p:column>

                    <p:column headerText="Nombre Completo">
                        <h:outputText value="#{sec.usuario.nombre} #{sec.usuario.apellidos}"/>
                    </p:column>

                    <p:column headerText="Usuario">
                        <h:outputText value="#{sec.usuario.nombre_usuario}"/>
                    </p:column>

                    <p:column headerText="Teléfono">
                        <h:outputText value="#{sec.usuario.telefono}"/>
                    </p:column>

                    <p:column headerText="Turno">
                        <h:outputText value="#{sec.turno}"/>
                    </p:column>

                    <p:column headerText="Estado" style="text-align: center;">
                        <h:outputText value="ACTIVO" 
                                      rendered="#{sec.usuario.id_estado == 1}" 
                                      style="color:green; font-weight:bold; background: #e8f5e9; padding: 5px; border-radius: 4px;"/>
                        
                        <h:outputText value="INACTIVO" 
                                      rendered="#{sec.usuario.id_estado != 1}" 
                                      style="color:red; font-weight:bold; background: #ffebee; padding: 5px; border-radius: 4px;"/>
                    </p:column>

                    <p:column headerText="Acciones" style="text-align: center;">
                        
                        <p:commandButton icon="pi pi-pencil"
                                         styleClass="ui-button-warning ui-button-flat"
                                         actionListener="#{secretariaBean.prepararEdicion(sec)}"
                                         update=":dialogoForm"
                                         oncomplete="PF('wdialogo').show()"
                                         title="Editar"/>

                        <p:commandButton icon="#{sec.usuario.id_estado == 1 ? 'pi pi-ban' : 'pi pi-check'}"
                                         styleClass="ui-button-flat #{sec.usuario.id_estado == 1 ? 'ui-button-danger' : 'ui-button-success'}"
                                         actionListener="#{secretariaBean.cambiarEstado(sec)}"
                                         update="tablaSecretarias"
                                         title="#{sec.usuario.id_estado == 1 ? 'Desactivar Usuario' : 'Activar Usuario'}">
                        </p:commandButton>

                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

        <p:dialog id="dialogoForm"
                  widgetVar="wdialogo"
                  header="Datos de Secretaria"
                  modal="true"
                  width="600"
                  responsive="true">

            <h:form id="formDialogo" class="ui-fluid">

                <p:messages showDetail="true" closable="true"/>

                <h3>Datos Personales</h3>

                <div class="p-field">
                    <p:outputLabel value="Nombre"/>
                    <p:inputText value="#{secretariaBean.usuarioActual.nombre}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Apellidos"/>
                    <p:inputText value="#{secretariaBean.usuarioActual.apellidos}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Teléfono"/>
                    <p:inputText value="#{secretariaBean.usuarioActual.telefono}"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Correo"/>
                    <p:inputText value="#{secretariaBean.usuarioActual.correo}" required="true"/>
                </div>

                <p:separator/>

                <h3>Datos Laborales</h3>

                <div class="p-field">
                    <p:outputLabel value="Turno"/>
                    <p:selectOneMenu value="#{secretariaBean.secretariaActual.turno}" required="true">
                        <f:selectItem itemLabel="Completo" itemValue="Completo"/>
                        <f:selectItem itemLabel="Mañana" itemValue="Mañana"/>
                        <f:selectItem itemLabel="Tarde" itemValue="Tarde"/>
                    </p:selectOneMenu>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Usuario"/>
                    <p:inputText value="#{secretariaBean.usuarioActual.nombre_usuario}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Contraseña"/>
                    <p:password value="#{secretariaBean.usuarioActual.contrasena}"
                        required="#{secretariaBean.secretariaActual.id_secretaria eq 0}"
                        placeholder="#{secretariaBean.secretariaActual.id_secretaria ne 0 ? 'Dejar vacío para no cambiar' : ''}"
                    feedback="false"/>
                </div>

                <div style="text-align:right;margin-top:15px">

                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('wdialogo').hide()"/>

                    <p:commandButton value="Guardar"
                                     icon="pi pi-save"
                                     styleClass="ui-button-success"
                                     actionListener="#{secretariaBean.guardarSecretaria}"
                                     update=":formLista:tablaSecretarias"
                                     oncomplete="if(!args.validationFailed) PF('wdialogo').hide()"/>

                </div>

            </h:form>
        </p:dialog>

        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="Sí" type="button" styleClass="ui-confirmdialog-yes"/>
                <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-secondary"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
