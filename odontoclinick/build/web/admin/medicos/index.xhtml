<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Médicos</ui:define>

    <ui:define name="contenido">

        <p:panel style="margin-bottom:20px;
                        background:linear-gradient(135deg,#0d6efd,#0b5ed7);
                        color:white;border-radius:10px">
            <h2 style="margin:0">Directorio Médico</h2>
            <p style="margin:5px 0 0;opacity:.9">
                Administración del personal médico
            </p>
        </p:panel>

        <h:form id="formMedicos">

            <p:panel header="Listado de Médicos">

                <div style="text-align:right;margin-bottom:15px">
                    <p:commandButton value="Nuevo Médico"
                                     icon="pi pi-user-plus"
                                     styleClass="ui-button-success"
                                     actionListener="#{medicoBean.prepararNuevo}"
                                     update=":dialogoForm"
                                     oncomplete="PF('dlgMedico').show()"/>
                </div>

                <p:dataTable id="tabla"
                             value="#{medicoBean.listaMedicos}"
                             var="med"
                             paginator="true"
                             rows="10"
                             rowKey="#{med.id_doctor}"
                             emptyMessage="No hay médicos registrados">

                    <p:column headerText="Especialidad">
                        <h:outputText value="#{med.especialidad.nombre_especialidad}" 
                        style="background-color: #e3f2fd; color: #0d47a1; padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 0.9em;"/>
                    </p:column>
                    <p:column headerText="Médico">
                        <strong>
                            #{med.usuario.nombre} #{med.usuario.apellidos}
                        </strong><br/>
                        <small>Licencia: #{med.licencia_medica}</small>
                    </p:column>

                    <p:column headerText="Contacto">
                        <i class="pi pi-envelope"></i> #{med.usuario.correo}<br/>
                        <i class="pi pi-phone"></i> #{med.usuario.telefono}
                    </p:column>

                    <p:column headerText="Estado" style="text-align: center; width: 100px;">
                        <h:outputText value="ACTIVO" 
                                      rendered="#{med.usuario.id_estado eq 1}" 
                                      style="color:green; font-weight:bold; background: #e8f5e9; padding: 4px; border-radius: 4px;"/>
                        
                        <h:outputText value="INACTIVO" 
                                      rendered="#{med.usuario.id_estado ne 1}" 
                                      style="color:red; font-weight:bold; background: #ffebee; padding: 4px; border-radius: 4px;"/>
                    </p:column>

                    <p:column headerText="Acciones" style="text-align: center; width: 120px;">

                        <p:commandButton icon="pi pi-pencil"
                                         styleClass="ui-button-warning ui-button-flat"
                                         actionListener="#{medicoBean.prepararEdicion(med)}"
                                         update=":dialogoForm"
                                         oncomplete="PF('dlgMedico').show()"
                                         title="Editar"/>

                        <p:commandButton icon="#{med.usuario.id_estado eq 1 ? 'pi pi-ban' : 'pi pi-check-circle'}"
                                         styleClass="ui-button-flat #{med.usuario.id_estado eq 1 ? 'ui-button-danger' : 'ui-button-success'}"
                                         actionListener="#{medicoBean.cambiarEstado(med)}"
                                         update="tabla"
                                         title="#{med.usuario.id_estado eq 1 ? 'Desactivar' : 'Reactivar'}">
                        </p:commandButton>

                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

        <p:dialog id="dialogoForm"
                  widgetVar="dlgMedico"
                  header="Datos del Médico"
                  modal="true"
                  width="720"
                  responsive="true">

            <h:form id="formDialogoMedico" class="ui-fluid">

                <p:messages showDetail="true" closable="true"/>

                <h3>Datos Personales</h3>
                
                <div class="p-field">
                    <p:outputLabel value="Nombre"/>
                    <p:inputText value="#{medicoBean.usuarioActual.nombre}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Apellidos"/>
                    <p:inputText value="#{medicoBean.usuarioActual.apellidos}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Correo"/>
                    <p:inputText value="#{medicoBean.usuarioActual.correo}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Teléfono"/>
                    <p:inputText value="#{medicoBean.usuarioActual.telefono}"/>
                </div>

                <p:separator/>

                <h3>Información Profesional</h3>

                <div class="p-field">
                    <p:outputLabel value="Especialidad"/>
                    <p:selectOneMenu value="#{medicoBean.medicoActual.id_especialidad}" required="true">
                        <f:selectItem itemLabel="Seleccione..." itemValue=""/>
                        <f:selectItems value="#{medicoBean.listaEspecialidades}"
                                       var="e"
                                       itemLabel="#{e.nombre_especialidad}"
                                       itemValue="#{e.id_especialidad}"/>
                    </p:selectOneMenu>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Licencia Médica"/>
                    <p:inputText value="#{medicoBean.medicoActual.licencia_medica}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Años de Experiencia"/>
                    <p:spinner value="#{medicoBean.medicoActual.anos_experiencia}" min="0"/>
                </div>

                <p:separator/>

                <h3>Acceso</h3>

                <div class="p-field">
                    <p:outputLabel value="Usuario"/>
                    <p:inputText value="#{medicoBean.usuarioActual.nombre_usuario}" required="true"/>
                </div>

                <div class="p-field">
                    <p:outputLabel value="Contraseña"/>
                    <p:password value="#{medicoBean.usuarioActual.contrasena}"
                                required="#{medicoBean.medicoActual.id_doctor eq 0}"
                                placeholder="#{medicoBean.medicoActual.id_doctor ne 0 ? 'Dejar vacío para mantener actual' : ''}"
                                feedback="false"/>
                </div>

                <div style="text-align:right;margin-top:15px">

                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('dlgMedico').hide()"/>

                    <p:commandButton value="Guardar Médico"
                                     icon="pi pi-save"
                                     styleClass="ui-button-primary"
                                     actionListener="#{medicoBean.guardarMedico}"
                                     update=":formMedicos:tabla"
                                     oncomplete="if(!args.validationFailed) PF('dlgMedico').hide()"/>

                </div>

            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
