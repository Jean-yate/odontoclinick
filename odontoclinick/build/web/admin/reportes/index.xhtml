<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Centro de Reportes</ui:define>

    <ui:define name="contenido">
        
        <div class="card-modern">
            <h2 style="color: #495057; margin-bottom: 20px;">
                <i class="pi pi-chart-bar" style="margin-right: 10px;"></i>
                Reportes Generales
            </h2>

            <p:tabView dynamic="true" cache="true">

                <p:tab title="Inventario Valorado">
                    <h:form>
                        <div style="text-align: right; margin-bottom: 10px;">
                            <h:commandLink>
                                <p:commandButton value="Excel" icon="pi pi-file-excel" styleClass="ui-button-success"/>
                                <p:dataExporter type="xls" target="tblInventario" fileName="Reporte_Inventario_Valorado"/>
                            </h:commandLink>
                            <h:commandLink>
                                <p:commandButton value="PDF" icon="pi pi-file-pdf" styleClass="ui-button-danger" style="margin-left: 5px;"/>
                                <p:dataExporter type="pdf" target="tblInventario" fileName="Reporte_Inventario_Valorado"/>
                            </h:commandLink>
                        </div>

                        <p:dataTable id="tblInventario" value="#{productoBean.listaProductos}" var="prod" 
                                     rows="10" paginator="true">
                            
                            <p:column headerText="Producto" filterBy="#{prod.nombre_producto}" filterMatchMode="contains">
                                <h:outputText value="#{prod.nombre_producto}" />
                            </p:column>

                            <p:column headerText="Stock Actual" style="text-align: center;">
                                <h:outputText value="#{prod.stock_actual}" />
                            </p:column>

                            <p:column headerText="Costo Unitario" style="text-align: right;">
                                <h:outputText value="#{prod.precio_compra}">
                                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Valor Total" style="text-align: right; font-weight: bold; background-color: #f8f9fa;">
                                <h:outputText value="#{prod.stock_actual * prod.precio_compra}">
                                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                </h:outputText>
                            </p:column>
                        </p:dataTable>
                    </h:form>
                </p:tab>

                <p:tab title="Ingresos Financieros">
                    <h:form>
                        <div style="text-align: right; margin-bottom: 10px;">
                            <h:commandLink>
                                <p:commandButton value="Excel" icon="pi pi-file-excel" styleClass="ui-button-success"/>
                                <p:dataExporter type="xls" target="tblPagos" fileName="Reporte_Ingresos"/>
                            </h:commandLink>
                            <h:commandLink>
                                <p:commandButton value="PDF" icon="pi pi-file-pdf" styleClass="ui-button-danger" style="margin-left: 5px;"/>
                                <p:dataExporter type="pdf" target="tblPagos" fileName="Reporte_Ingresos"/>
                            </h:commandLink>
                        </div>

                        <p:dataTable id="tblPagos" value="#{pagoBean.listaPagos}" var="pago" 
                                     rows="10" paginator="true" sortBy="#{pago.fechaPago}" sortOrder="descending">
                            
                            <p:column headerText="Fecha">
                                <h:outputText value="#{pago.fechaPago}">
                                    <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Paciente" filterBy="#{pago.cita.paciente.usuario.nombre}" filterMatchMode="contains">
                                <h:outputText value="#{pago.cita.paciente.usuario.nombre} #{pago.cita.paciente.usuario.apellidos}" />
                            </p:column>

                            <p:column headerText="Método">
                                <h:outputText value="#{pago.idMetodoPago eq 1 ? 'Efectivo' : 'Tarjeta/Otro'}" />
                            </p:column>

                            <p:column headerText="Monto" style="text-align: right;">
                                <h:outputText value="#{pago.monto}">
                                    <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                </h:outputText>
                            </p:column>
                            
                            <p:columnGroup type="footer">
                                <p:row>
                                    <p:column colspan="3" style="text-align:right" footerText="TOTAL ACUMULADO:" />
                                    <p:column style="text-align:right">
                                        <f:facet name="footer">
                                            <h:outputText value="#{pagoBean.totalIngresos}">
                                                <f:convertNumber type="currency" currencySymbol="$" maxFractionDigits="0"/>
                                            </h:outputText>
                                        </f:facet>
                                    </p:column>
                                </p:row>
                            </p:columnGroup>

                        </p:dataTable>
                    </h:form>
                </p:tab>

                <p:tab title="Citas por Médico">
                    <h:form>
                        <div style="text-align: right; margin-bottom: 10px;">
                            <h:commandLink>
                                <p:commandButton value="Excel" icon="pi pi-file-excel" styleClass="ui-button-success"/>
                                <p:dataExporter type="xls" target="tblCitas" fileName="Reporte_Citas_Medicas"/>
                            </h:commandLink>
                        </div>

                        <p:dataTable id="tblCitas" value="#{citaBean.listaCitas}" var="cita" 
                                     rows="10" paginator="true">
                            
                            <p:column headerText="Fecha" sortBy="#{cita.fecha_hora}">
                                <h:outputText value="#{cita.fecha_hora}">
                                    <f:convertDateTime pattern="dd/MM/yyyy"/>
                                </h:outputText>
                            </p:column>

                            <p:column headerText="Médico" filterBy="#{cita.medico.usuario.nombre}" filterMatchMode="contains">
                                <h:outputText value="#{cita.medico.usuario.nombre} #{cita.medico.usuario.apellidos}" />
                            </p:column>

                            <p:column headerText="Paciente">
                                <h:outputText value="#{cita.paciente.usuario.nombre} #{cita.paciente.usuario.apellidos}" />
                            </p:column>

                            <p:column headerText="Estado">
                                <h:outputText value="#{cita.estadoCita.nombre_estado}" />
                            </p:column>

                        </p:dataTable>
                    </h:form>
                </p:tab>

            </p:tabView>
        </div>
    </ui:define>
</ui:composition>
