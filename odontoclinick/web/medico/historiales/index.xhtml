<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Historiales Clínicos</ui:define>

    <ui:define name="contenido">
        
        <h:form id="formHistorial">
            
            <div class="card-modern" style="padding: 20px; border-left: 5px solid #0d6efd;">
                <h3 style="margin-top: 0; color: #0d6efd;"><i class="pi pi-search"></i> Filtros de Búsqueda</h3>
                
                <div class="ui-fluid p-formgrid p-grid">
                    <div class="p-field p-col-12 p-md-3">
                        <p:outputLabel value="Paciente" for="pac"/>
                        <p:inputText id="pac" value="#{historialMedicoBean.filtroPaciente}" placeholder="Nombre o Apellido"/>
                    </div>
                    
                    <div class="p-field p-col-12 p-md-2">
                        <p:outputLabel value="Desde" for="f1"/>
                        <p:calendar id="f1" value="#{historialMedicoBean.fechaInicio}" pattern="dd/MM/yyyy" showOn="button"/>
                    </div>
                    
                    <div class="p-field p-col-12 p-md-2">
                        <p:outputLabel value="Hasta" for="f2"/>
                        <p:calendar id="f2" value="#{historialMedicoBean.fechaFin}" pattern="dd/MM/yyyy" showOn="button"/>
                    </div>
                    
                    <div class="p-field p-col-12 p-md-3">
                        <p:outputLabel value="Diagnóstico/Procedimiento" for="diag"/>
                        <p:inputText id="diag" value="#{historialMedicoBean.filtroDiagnostico}" placeholder="Palabra clave..."/>
                    </div>
                    
                    <div class="p-field p-col-12 p-md-2" style="display: flex; align-items: flex-end;">
                        <p:commandButton value="Buscar" actionListener="#{historialMedicoBean.buscarConFiltros()}" 
                                         update="tablaHistoriales" icon="pi pi-search" styleClass="btn-success"/>
                    </div>
                </div>
            </div>

            <div class="card-modern">
                <p:dataTable id="tablaHistoriales" value="#{historialMedicoBean.listaHistoriales}" var="h"
                             paginator="true" rows="10" reflow="true" 
                             emptyMessage="No se encontraron historiales con los filtros aplicados.">
                    
                    <p:column headerText="Fecha" sortBy="#{h.fecha}" width="100">
                        <h:outputText value="#{h.fecha}">
                            <f:convertDateTime pattern="dd/MM/yyyy"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Paciente" sortBy="#{h.paciente.usuario.nombre}">
                        <i class="pi pi-user"></i> 
                        <h:outputText value="#{h.paciente.usuario.nombre} #{h.paciente.usuario.apellidos}" style="font-weight: bold;"/>
                    </p:column>

                    <p:column headerText="Procedimiento">
                        <h:outputText value="#{h.tratamiento_realizado}" />
                    </p:column>

                    <p:column headerText="Diagnóstico">
                        <h:outputText value="#{h.diagnostico}" />
                    </p:column>

                    <p:column headerText="Acciones" style="text-align: center; width: 120px;">
                        <p:commandButton icon="pi pi-eye" title="Ver Detalle" 
                                         oncomplete="PF('dlgVer').show()" update=":dialogoVer"
                                         styleClass="btn-info" style="margin-right: 5px;">
                            <f:setPropertyActionListener value="#{h}" target="#{historialMedicoBean.historialActual}" />
                        </p:commandButton>
                    </p:column>

                </p:dataTable>
            </div>
        </h:form>

        <p:dialog id="dialogoVer" widgetVar="dlgVer" header="Detalle Historial" modal="true" width="600" responsive="true">
            <h:form>
                <div class="ui-fluid">
                    <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank">
                        <h:outputText value="Paciente:" style="font-weight: bold;"/>
                        <h:outputText value="#{historialMedicoBean.historialActual.paciente.usuario.nombre} #{historialMedicoBean.historialActual.paciente.usuario.apellidos}"/>
                        
                        <h:outputText value="Fecha Atención:" style="font-weight: bold;"/>
                        <h:outputText value="#{historialMedicoBean.historialActual.fecha}"><f:convertDateTime pattern="dd/MM/yyyy"/></h:outputText>
                        
                        <h:outputText value="Diagnóstico:" style="font-weight: bold;"/>
                        <h:inputTextarea value="#{historialMedicoBean.historialActual.diagnostico}" readonly="true"/>
                        
                        <h:outputText value="Tratamiento Realizado:" style="font-weight: bold;"/>
                        <h:inputTextarea value="#{historialMedicoBean.historialActual.tratamiento_realizado}" readonly="true"/>
                        
                        <h:outputText value="Observaciones:" style="font-weight: bold;"/>
                        <h:inputTextarea value="#{historialMedicoBean.historialActual.observaciones}" readonly="true"/>
                    </p:panelGrid>
                </div>
            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
