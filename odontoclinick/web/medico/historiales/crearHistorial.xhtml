<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Registrar Nuevo Historial</ui:define>

    <ui:define name="contenido">
        
        <div class="ui-g">
            <div class="ui-g-12 ui-md-8 ui-lg-6" style="margin: 0 auto;">
                
                <h:form id="formCreacion">
                    <p:growl id="growl" showDetail="true" life="4000" />
                    
                    <p:panel header="Registro de Historial Médico" style="border-top: 4px solid #00A65A; padding: 10px;">
                        
                        <div class="ui-fluid">
                            
                            <p:outputLabel value="Seleccionar Paciente:" for="selPac" style="font-weight: bold;"/>
                            <p:selectOneMenu id="selPac" 
                                             value="#{historialMedicoBean.idPacienteSeleccionado}" 
                                             required="true"
                                             filter="true" 
                                             filterMatchMode="contains"
                                             converter="javax.faces.Integer">
                                
                                <f:selectItem itemLabel="-- Seleccione un Paciente --" itemValue="#{null}" noSelectionOption="true" />
                                <f:selectItems value="#{historialMedicoBean.listaPacientes}" 
                                               var="pac"
                                               itemLabel="#{pac.usuario.nombre} #{pac.usuario.apellidos} (ID: #{pac.id_paciente})"
                                               itemValue="#{pac.id_paciente}"/>
                                
                                <p:ajax listener="#{historialMedicoBean.vincularPacienteSeleccionado()}" 
                                        update="@this formularioClinico growl" process="@this"/>
                            </p:selectOneMenu>
                            
                            <p:separator style="margin-top: 20px; margin-bottom: 20px;"/>
                            
                            <h:panelGroup id="formularioClinico">
                                <h4 style="color: #0d6efd; margin-top: 0;">Detalles Clínicos (Fecha: #{historialMedicoBean.fechaActual})</h4>
                                
                                <h:panelGroup rendered="#{historialMedicoBean.historialActual.paciente != null}">
                                    
                                    <p:outputLabel value="Diagnóstico" for="diag" style="font-weight: bold;"/>
                                    <p:inputTextarea id="diag" 
                                                     value="#{historialMedicoBean.historialActual.diagnostico}" 
                                                     rows="3" 
                                                     required="true" 
                                                     placeholder="Escriba el diagnóstico del paciente..."/>
                                    
                                    <p:outputLabel value="Procedimiento / Tratamiento Realizado" for="proc" style="font-weight: bold; margin-top: 10px; display: block;"/>
                                    <p:inputTextarea id="proc" 
                                                     value="#{historialMedicoBean.historialActual.tratamiento_realizado}" 
                                                     rows="3" 
                                                     required="true" 
                                                     placeholder="Descripción del procedimiento..."/>
                                    
                                    <p:outputLabel value="Observaciones / Receta" for="obs" style="font-weight: bold; margin-top: 10px; display: block;"/>
                                    <p:inputTextarea id="obs" 
                                                     value="#{historialMedicoBean.historialActual.observaciones}" 
                                                     rows="2" 
                                                     placeholder="Indicaciones adicionales..."/>

                                    
                                    <div style="margin-top: 25px; text-align: right;">
                                        <p:button value="Cancelar" 
                                                  outcome="/medico/historiales/index" 
                                                  styleClass="ui-button-secondary" 
                                                  style="margin-right: 10px;"/>
                                        
                                        <p:commandButton value="Guardar Historial" 
                                                         action="#{historialMedicoBean.guardarNuevoHistorial()}" 
                                                         update="@form growl" 
                                                         icon="pi pi-save" 
                                                         styleClass="ui-button-primary"/>
                                    </div>
                                    
                                </h:panelGroup>
                                
                            </h:panelGroup>
                        </div>
                    </p:panel>
                </h:form>
                
            </div>
        </div>

    </ui:define>
</ui:composition>
