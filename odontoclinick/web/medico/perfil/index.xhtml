<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Mi Perfil</ui:define>

    <ui:define name="contenido">
        
        <div class="ui-g ui-fluid">
            <div class="ui-g-12 ui-md-8 ui-lg-6" style="margin: 0 auto;">
                <div class="card-modern" style="padding: 30px;">
                    
                    <h3 style="border-bottom: 2px solid #0d6efd; padding-bottom: 10px; margin-bottom: 20px;">
                        <i class="pi pi-user-edit"></i> Editar Mis Datos
                    </h3>

                    <h:form>
                        <p:messages showDetail="true" closable="true"/>

                        <p:panelGrid columns="1" layout="grid" styleClass="ui-panelgrid-blank">
                            
                            <p:outputLabel value="Nombre Completo (No editable)" style="font-weight: bold;"/>
                            <p:inputText value="#{medicoBean.medicoActual.usuario.nombre} #{medicoBean.medicoActual.usuario.apellidos}" readonly="true" style="background-color: #e9ecef;"/>

                            <p:outputLabel value="Especialidad (No editable)" style="font-weight: bold;"/>
                            <p:inputText value="#{medicoBean.medicoActual.especialidad.nombre_especialidad}" readonly="true" style="background-color: #e9ecef;"/>

                            <p:outputLabel value="Teléfono de Contacto" for="tel" style="font-weight: bold;"/>
                            <p:inputText id="tel" value="#{medicoBean.medicoActual.usuario.telefono}" required="true"/>

                            <p:outputLabel value="Correo Electrónico" for="email" style="font-weight: bold;"/>
                            <p:inputText id="email" value="#{medicoBean.medicoActual.usuario.correo}" required="true" type="email"/>

                            <p:outputLabel value="Cambiar Contraseña (Opcional)" for="pass" style="font-weight: bold;"/>
                            <p:password id="pass" value="#{medicoBean.usuarioActual.contrasena}" placeholder="Dejar en blanco para no cambiar"/>

                        </p:panelGrid>

                        <div style="margin-top: 20px;">
                            <p:commandButton value="Actualizar Perfil" action="#{medicoBean.actualizarPerfil()}" 
                                             styleClass="btn-primary" style="width: 100%; padding: 10px;"/>
                        </div>
                    </h:form>
                </div>
            </div>
        </div>

    </ui:define>
</ui:composition>
