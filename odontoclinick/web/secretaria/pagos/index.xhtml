<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Pagos</ui:define>

    <ui:define name="contenido">

        <h:form id="formPagos">

            <p:panel header="💰 Pagos Recibidos" styleClass="card-modern">

                <!-- ACCIÓN PRINCIPAL -->
                <div style="text-align:right; margin-bottom:15px;">
                    <p:commandButton value="Registrar Pago"
                                     icon="pi pi-dollar"
                                     styleClass="ui-button-success"
                                     actionListener="#{pagoBean.resetFormulario}"
                                     update=":dialogoPago"
                                     oncomplete="PF('wDialogoPago').show();" />
                </div>

                <!-- TABLA -->
                <p:dataTable id="tablaPagos"
                             value="#{pagoBean.listaPagos}"
                             var="pago"
                             paginator="true"
                             rows="10"
                             rowKey="#{pago.idPago}"
                             styleClass="tabla-pagos"
                             emptyMessage="No hay pagos registrados.">

                    <p:column headerText="ID" style="text-align:center; width:70px;">
                        #{pago.idPago}
                    </p:column>

                    <p:column headerText="Paciente">
                        Cita ##{pago.idCita}
                    </p:column>

                    <p:column headerText="Monto" style="text-align:right;">
                        <span class="monto-pago">
                            <h:outputText value="#{pago.monto}">
                                <f:convertNumber type="currency"
                                                 currencySymbol="$"
                                                 maxFractionDigits="0"/>
                            </h:outputText>
                        </span>
                    </p:column>

                    <p:column headerText="Fecha" style="text-align:center;">
                        <h:outputText value="#{pago.fechaPago}">
                            <f:convertDateTime pattern="dd/MM/yyyy HH:mm"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Método" style="text-align:center;">
                        <span class="metodo-pago">
                            #{pago.idMetodoPago == 1 ? 'Efectivo' :
                              pago.idMetodoPago == 2 ? 'T. Crédito' :
                              pago.idMetodoPago == 3 ? 'T. Débito' :
                              pago.idMetodoPago == 4 ? 'Transferencia' : 'Otro'}
                        </span>
                    </p:column>

                    <p:column headerText="Referencia">
                        #{pago.referencia}
                    </p:column>

                    <p:column headerText="Acción" style="text-align:center; width:90px;">
                        <p:commandButton icon="pi pi-print"
                                         title="Imprimir Recibo"
                                         type="button"
                                         styleClass="ui-button-secondary ui-button-rounded"
                                         onclick="alert('Funcionalidad pendiente');"/>
                    </p:column>

                </p:dataTable>

            </p:panel>
        </h:form>

        <!-- DIALOGO -->
        <p:dialog id="dialogoPago"
                  widgetVar="wDialogoPago"
                  header="🧾 Registrar Pago"
                  modal="true"
                  resizable="false"
                  width="500"
                  appendTo="@(body)">

            <h:form>

                <p:messages closable="true"/>

                <h:panelGrid columns="2" cellpadding="6" style="width:100%">

                    <p:outputLabel value="Cita:" />
                    <p:selectOneMenu value="#{pagoBean.pagoActual.idCita}"
                                     filter="true" required="true">
                        <f:selectItem itemLabel="Seleccione..." itemValue="" />
                        <f:selectItems value="#{pagoBean.listaCitasPendientes}"
                                       var="c"
                                       itemLabel="Cita ##{c.id_cita} - #{c.paciente.usuario.nombre}"
                                       itemValue="#{c.id_cita}" />
                    </p:selectOneMenu>

                    <p:outputLabel value="Monto:" />
                    <p:inputNumber value="#{pagoBean.pagoActual.monto}"
                                   symbol="$ "
                                   symbolPosition="p"
                                   required="true"/>

                    <p:outputLabel value="Método:" />
                    <p:selectOneMenu value="#{pagoBean.pagoActual.idMetodoPago}"
                                     required="true">
                        <f:selectItem itemLabel="Efectivo" itemValue="1"/>
                        <f:selectItem itemLabel="Tarjeta Crédito" itemValue="2"/>
                        <f:selectItem itemLabel="Tarjeta Débito" itemValue="3"/>
                        <f:selectItem itemLabel="Transferencia" itemValue="4"/>
                    </p:selectOneMenu>

                    <p:outputLabel value="Referencia:" />
                    <p:inputText value="#{pagoBean.pagoActual.referencia}"/>

                </h:panelGrid>

                <div style="text-align:center; margin-top:15px;">
                    <p:commandButton value="Guardar"
                                     icon="pi pi-check"
                                     styleClass="ui-button-success"
                                     actionListener="#{pagoBean.guardar}"
                                     update=":formPagos:tablaPagos :dialogoPago"
                                     oncomplete="if(!args.validationFailed) PF('wDialogoPago').hide();"/>

                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('wDialogoPago').hide();"
                                     style="margin-left:10px;"/>
                </div>

            </h:form>
        </p:dialog>

    </ui:define>
</ui:composition>
