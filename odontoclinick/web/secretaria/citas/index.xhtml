<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Citas</ui:define>

    <ui:define name="contenido">

        <h:form id="formCitas">

            <p:panel header="📅 Agenda de Citas Médicas" styleClass="card-modern">

                <!-- FILTROS -->
                <div class="ui-g ui-fluid" style="margin-bottom:20px;">

                    <div class="ui-g-12 ui-md-3">
                        <p:inputText value="#{citaBean.filtroPaciente}"
                                     placeholder="Paciente" />
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:inputText value="#{citaBean.filtroMedico}"
                                     placeholder="Médico" />
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:selectOneMenu value="#{citaBean.filtroEstado}">
                            <f:selectItem itemLabel="-- Estado --" itemValue="" />
                            <f:selectItems value="#{citaBean.listaEstados}"
                                           var="e"
                                           itemLabel="#{e.nombre_estado}"
                                           itemValue="#{e.id_estado_cita}" />
                        </p:selectOneMenu>
                    </div>

                    <div class="ui-g-12 ui-md-3">
                        <p:commandButton value="Filtrar"
                                         icon="pi pi-search"
                                         actionListener="#{citaBean.buscar}"
                                         update="tablaCitas"
                                         styleClass="ui-button-primary"
                                         style="width:100%" />
                    </div>
                </div>

                <div style="text-align:right; margin-bottom:15px;">
                    <p:commandButton value="Nueva Cita"
                                     icon="pi pi-calendar-plus"
                                     styleClass="ui-button-success"
                                     actionListener="#{citaBean.prepararCreacion}"
                                     update=":dialogoCita"
                                     oncomplete="PF('wdialogoCita').show();" />
                </div>

                <!-- TABLA -->
                <p:dataTable id="tablaCitas"
                             value="#{citaBean.listaCitas}"
                             var="cita"
                             paginator="true"
                             rows="10"
                             rowKey="#{cita.id_cita}"
                             emptyMessage="No se encontraron citas."
                             styleClass="tabla-striped">


                    <p:column headerText="Fecha" style="text-align:center">
                        <h:outputText value="#{cita.fecha_hora}">
                            <f:convertDateTime pattern="dd/MM/yyyy" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Hora" style="text-align:center">
                        <h:outputText value="#{cita.fecha_hora}">
                            <f:convertDateTime pattern="HH:mm" />
                        </h:outputText>
                    </p:column>

                    <p:column headerText="Paciente">
                        #{cita.paciente.usuario.nombre} #{cita.paciente.usuario.apellidos}
                    </p:column>

                    <p:column headerText="Médico">
                        #{cita.medico.usuario.nombre} #{cita.medico.usuario.apellidos}
                    </p:column>

                    <p:column headerText="Estado" style="text-align:center">
                        <span style="
                            background-color:#{cita.estadoCita.color};
                            color:#ffffff;
                            padding:4px 10px;
                            border-radius:4px;
                            font-weight:bold;
                            display:inline-block;
                            opacity:1;">
                            #{cita.estadoCita.nombre_estado}
                        </span>
                    </p:column>


                    <!-- ACCIONES -->
                    <p:column headerText="Acciones"
                              style="text-align:center"
                              styleClass="acciones">

                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         styleClass="ui-button-warning ui-button-rounded"
                                         actionListener="#{citaBean.setCitaActual(cita)}"
                                         update=":dialogoCita"
                                         oncomplete="PF('wdialogoCita').show();" />

                        <p:commandButton icon="pi pi-times-circle"
                                         title="Cancelar"
                                         styleClass="ui-button-danger ui-button-rounded"
                                         rendered="#{cita.estadoCita.id_estado_cita ne 5}"
                                         actionListener="#{citaBean.cancelar(cita)}"
                                         update="tablaCitas">
                            <p:confirm header="Cancelar Cita"
                                       message="¿Desea cancelar esta cita?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>

                    </p:column>

                </p:dataTable>

            </p:panel>
        </h:form>

        <!-- DIALOGO -->
        <p:dialog id="dialogoCita"
                  widgetVar="wdialogoCita"
                  header="Información de la Cita"
                  modal="true"
                  width="550"
                  resizable="false"
                  appendTo="@(body)">

            <h:form>
                <p:messages closable="true"/>

                <h:panelGrid columns="2" style="width:100%" cellpadding="6">

                    <p:outputLabel value="Paciente:" />
                    <p:selectOneMenu value="#{citaBean.citaActual.id_paciente}"
                                     filter="true" required="true">
                        <f:selectItem itemLabel="Seleccione" itemValue="" />
                        <f:selectItems value="#{citaBean.listaPacientes}"
                                       var="p"
                                       itemLabel="#{p.usuario.nombre} #{p.usuario.apellidos}"
                                       itemValue="#{p.id_paciente}" />
                    </p:selectOneMenu>

                    <p:outputLabel value="Médico:" />
                    <p:selectOneMenu value="#{citaBean.citaActual.id_doctor}"
                                     filter="true" required="true">
                        <p:ajax listener="#{citaBean.cargarHorasDisponibles}" update="hora"/>
                        <f:selectItem itemLabel="Seleccione" itemValue="" />
                        <f:selectItems value="#{citaBean.listaMedicos}"
                                       var="m"
                                       itemLabel="#{m.usuario.nombre} #{m.usuario.apellidos}"
                                       itemValue="#{m.id_doctor}" />
                    </p:selectOneMenu>

                    <p:outputLabel value="Fecha:" />
                    <p:calendar value="#{citaBean.fechaSeleccionada}"
                                pattern="dd/MM/yyyy"
                                required="true"
                                showOn="button">
                        <p:ajax event="dateSelect"
                                listener="#{citaBean.cargarHorasDisponibles}"
                                update="hora"/>
                    </p:calendar>

                    <p:outputLabel value="Hora:" />
                    <p:selectOneMenu id="hora"
                                     value="#{citaBean.horaSeleccionada}"
                                     required="true">
                        <f:selectItem itemLabel="Seleccione" itemValue="" />
                        <f:selectItems value="#{citaBean.horasDisponibles}" />
                    </p:selectOneMenu>

                </h:panelGrid>

                <div style="text-align:center; margin-top:20px;">
                    <p:commandButton value="Guardar"
                                     icon="pi pi-save"
                                     styleClass="ui-button-success"
                                     actionListener="#{citaBean.guardar}"
                                     update=":formCitas:tablaCitas :dialogoCita"
                                     oncomplete="if(!args.validationFailed) PF('wdialogoCita').hide();" />

                    <p:commandButton value="Cerrar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary"
                                     onclick="PF('wdialogoCita').hide();"
                                     style="margin-left:10px;" />
                </div>
            </h:form>
        </p:dialog>

        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="Sí" type="button"
                                 styleClass="ui-confirmdialog-yes ui-button-success"
                                 icon="pi pi-check"/>
                <p:commandButton value="No" type="button"
                                 styleClass="ui-confirmdialog-no ui-button-secondary"
                                 icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
