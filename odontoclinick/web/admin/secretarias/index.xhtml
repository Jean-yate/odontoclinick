<?xml version='1.0' encoding='UTF-8' ?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
                xmlns:h="http://xmlns.jcp.org/jsf/html"
                xmlns:f="http://xmlns.jcp.org/jsf/core"
                xmlns:p="http://primefaces.org/ui"
                template="/WEB-INF/templates/plantilla.xhtml">

    <ui:define name="titulo">Gestión de Secretarias</ui:define>

    <ui:define name="contenido">

        <!-- ===== HEADER ===== -->
        <p:panel style="margin-bottom:20px;
                        background:linear-gradient(135deg,#6610f2,#6f42c1);
                        color:white;border-radius:10px">
            <h2 style="margin:0">Administración de Secretarias</h2>
            <p style="margin:5px 0 0;opacity:.9">
                Control de turnos, accesos y estados
            </p>
        </p:panel>

        <h:form id="formLista">
            <p:panel header="Listado de Secretarias">

                <div style="text-align:right;margin-bottom:15px">
                    <p:commandButton value="Agregar Secretaria"
                                     icon="pi pi-user-plus"
                                     styleClass="ui-button-success"
                                     actionListener="#{secretariaBean.prepararNuevo}"
                                     update=":dialogoForm"
                                     oncomplete="PF('wdialogo').show()"/>
                </div>

                <!-- ===== TABLA ===== -->
                <p:dataTable id="tablaSecretarias"
                             value="#{secretariaBean.listaSecretarias}"
                             var="sec"
                             paginator="true"
                             rows="10"
                             rowKey="#{sec.id_secretaria}"
                             emptyMessage="No hay secretarias registradas">

                    <p:column headerText="ID" width="60" style="text-align:center">
                        <h:outputText value="#{sec.id_secretaria}"/>
                    </p:column>

                    <p:column headerText="Nombre Completo"
                              filterBy="#{sec.usuario.nombre} #{sec.usuario.apellidos}"
                              filterMatchMode="contains">
                        <h:outputText value="#{sec.usuario.nombre} #{sec.usuario.apellidos}"
                                      style="font-weight:bold"/>
                    </p:column>

                    <p:column headerText="Usuario">
                        <h:outputText value="#{sec.usuario.nombre_usuario}"/>
                    </p:column>

                    <p:column headerText="Teléfono">
                        <h:outputText value="#{sec.usuario.telefono}"/>
                    </p:column>

                    <p:column headerText="Turno" style="text-align:center">
                        <span style="background:#0d6efd;color:white;
                                     padding:4px 10px;border-radius:20px;
                                     font-size:.85em">
                            #{sec.turno}
                        </span>
                    </p:column>

                    <!-- ===== ESTADO ===== -->
                    <p:column headerText="Estado" style="text-align:center;width:120px">

                        <h:panelGroup rendered="#{sec.usuario.estado.id_estado eq 1}">
                            <span style="background:#198754;color:white;
                                         padding:5px 12px;border-radius:20px;
                                         font-weight:bold;font-size:.85em">
                                <i class="pi pi-check-circle"></i> Activo
                            </span>
                        </h:panelGroup>

                        <h:panelGroup rendered="#{sec.usuario.estado.id_estado ne 1}">
                            <span style="background:#dc3545;color:white;
                                         padding:5px 12px;border-radius:20px;
                                         font-weight:bold;font-size:.85em">
                                <i class="pi pi-ban"></i> Inactivo
                            </span>
                        </h:panelGroup>

                    </p:column>

                    <!-- ===== ACCIONES ===== -->
                    <p:column headerText="Acciones" style="text-align:center;width:160px">

                        <!-- EDITAR -->
                        <p:commandButton icon="pi pi-pencil"
                                         title="Editar"
                                         styleClass="ui-button-warning ui-button-flat"
                                         actionListener="#{secretariaBean.setSecretariaActual(sec)}"
                                         action="#{secretariaBean.setUsuarioActual(sec.usuario)}"
                                         update=":dialogoForm"
                                         oncomplete="PF('wdialogo').show()"/>

                        <!-- INACTIVAR -->
                        <p:commandButton icon="pi pi-ban"
                                         title="Inactivar"
                                         styleClass="ui-button-danger ui-button-flat"
                                         actionListener="#{secretariaBean.eliminar(sec)}"
                                         update="tablaSecretarias"
                                         rendered="#{sec.usuario.estado.id_estado eq 1}">
                            <p:confirm header="Confirmar"
                                       message="¿Inactivar a esta secretaria?"
                                       icon="pi pi-exclamation-triangle"/>
                        </p:commandButton>

                        <!-- REACTIVAR -->
                        <p:commandButton icon="pi pi-check-circle"
                                         title="Reactivar"
                                         styleClass="ui-button-success ui-button-flat"
                                         actionListener="#{secretariaBean.reactivar(sec)}"
                                         update="tablaSecretarias"
                                         rendered="#{sec.usuario.estado.id_estado ne 1}"/>
                    </p:column>

                </p:dataTable>
            </p:panel>
        </h:form>

        <!-- ===== DIALOGO ===== -->
        <p:dialog id="dialogoForm"
                  widgetVar="wdialogo"
                  header="Datos de Secretaria"
                  modal="true"
                  width="600"
                  resizable="false">

            <h:form class="ui-fluid">
                <p:messages showDetail="true" closable="true"/>

                <h3 style="color:#6f42c1">Datos Personales</h3>

                <p:outputLabel value="Nombre"/>
                <p:inputText value="#{secretariaBean.usuarioActual.nombre}" required="true"/>

                <p:outputLabel value="Apellidos"/>
                <p:inputText value="#{secretariaBean.usuarioActual.apellidos}" required="true"/>

                <p:outputLabel value="Teléfono"/>
                <p:inputText value="#{secretariaBean.usuarioActual.telefono}"/>

                <p:outputLabel value="Correo"/>
                <p:inputText value="#{secretariaBean.usuarioActual.correo}" required="true"/>

                <p:separator/>

                <h3 style="color:#6f42c1">Datos Laborales</h3>

                <p:outputLabel value="Turno"/>
                <p:selectOneMenu value="#{secretariaBean.secretariaActual.turno}" required="true">
                    <f:selectItem itemLabel="Completo" itemValue="Completo"/>
                    <f:selectItem itemLabel="Mañana" itemValue="Mañana"/>
                    <f:selectItem itemLabel="Tarde" itemValue="Tarde"/>
                </p:selectOneMenu>

                <p:outputLabel value="Fecha Ingreso"/>
                <p:calendar value="#{secretariaBean.secretariaActual.fecha_ingreso}"
                            pattern="dd/MM/yyyy" showOn="button"/>

                <p:outputLabel value="Usuario"/>
                <p:inputText value="#{secretariaBean.usuarioActual.nombre_usuario}" required="true"/>

                <p:outputLabel value="Contraseña"/>
                <p:password value="#{secretariaBean.usuarioActual.contrasena}"
                            feedback="true"
                            placeholder="#{secretariaBean.secretariaActual.id_secretaria > 0 ? '(Dejar vacío para mantener)' : ''}"
                            required="#{secretariaBean.secretariaActual.id_secretaria == 0}"/>

                <f:facet name="footer">
                    <p:commandButton value="Cancelar"
                                     type="button"
                                     icon="pi pi-times"
                                     styleClass="ui-button-secondary ui-button-flat"
                                     onclick="PF('wdialogo').hide()"/>

                    <p:commandButton value="Guardar"
                                     icon="pi pi-save"
                                     styleClass="ui-button-success"
                                     actionListener="#{secretariaBean.guardarSecretaria}"
                                     update=":formLista:tablaSecretarias"
                                     oncomplete="if(!args.validationFailed) PF('wdialogo').hide()"/>
                </f:facet>

            </h:form>
        </p:dialog>

        <!-- ===== CONFIRM GLOBAL ===== -->
        <h:form>
            <p:confirmDialog global="true">
                <p:commandButton value="Sí" type="button"
                                 styleClass="ui-confirmdialog-yes" icon="pi pi-check"/>
                <p:commandButton value="No" type="button"
                                 styleClass="ui-confirmdialog-no" icon="pi pi-times"/>
            </p:confirmDialog>
        </h:form>

    </ui:define>
</ui:composition>
